<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 68" fill="none">
  <!-- Brand Icon Emblem -->
  <g transform="translate(2, 4)">
    <!-- Primary Shield / Workshop Hexagon Mark -->
    <rect x="2" y="2" width="56" height="56" rx="14" fill="#0F4C3A" />
    <rect x="2" y="2" width="56" height="56" rx="14" stroke="#16654F" stroke-width="2" />
    
    <!-- Crossed Architectural Blueprint & Level Tools -->
    <path d="M20 18L40 38" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <path d="M40 18L20 38" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="30" cy="28" r="5.5" fill="#0F4C3A" stroke="#F59E0B" stroke-width="3" />
    
    <!-- Foundation Level / Precision Bar -->
    <path d="M17 46H43" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="30" cy="46" r="2" fill="#FFFFFF" />
  </g>

  <!-- High Impact Typography -->
  <text x="72" y="40" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#0F172A" letter-spacing="-0.8">Fundi<tspan fill="#0F4C3A">Mtaani</tspan></text>
  <text x="74" y="54" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#D97706" letter-spacing="2">VERIFIED NAIROBI TRADES</text>
</svg>
